<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authorization complete — Mission Automation</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;max-width:720px;margin:60px auto;padding:0 20px;line-height:1.6;color:#1a1a1a;text-align:center}
.codebox{background:#f0f0f0;border:1px solid #ccc;border-radius:8px;padding:16px;word-break:break-all;font-family:monospace;font-size:14px;margin:24px 0;user-select:all}
.ok{color:#1a7f37}.err{color:#b42318}
button{font-size:16px;padding:10px 24px;border-radius:8px;border:none;background:#111;color:#fff;cursor:pointer}
</style>
</head>
<body>
<h1 id="heading">Authorization complete</h1>
<p id="sub">Copy the code below and send it back to continue setup.</p>
<div class="codebox" id="code">…</div>
<button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copy code</button>
<script>
const q = new URLSearchParams(location.search);
const code = q.get('code'), err = q.get('error');
if (code) {
  document.getElementById('code').textContent = code;
} else {
  document.getElementById('heading').textContent = 'Authorization failed';
  document.getElementById('heading').className = 'err';
  document.getElementById('sub').textContent = 'TikTok returned an error: ' + (err || 'unknown');
  document.getElementById('code').textContent = location.search;
}
</script>
</body>
</html>
